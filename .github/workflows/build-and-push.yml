name: build-and-push

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Extra tag to publish (optional)'
        required: false
        type: string

env:
  REGISTRY: registry.cn-hangzhou.aliyuncs.com
  IMAGE: ${{ vars.ALIYUN_NAMESPACE }}/concourse-fly-resource

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify resource scripts emit valid JSON
        run: |
          set -e
          out_ver=$(jq -n --arg ts "$(date +%s%N)" '{ version: { ts: $ts } }')
          echo "$out_ver" | jq -e '.version | length > 0' > /dev/null
          echo "out: $out_ver"

          echo '{"version":{"ts":"123"},"source":{}}' > /tmp/p.json
          in_ver=$(jq -n --argjson version "$(jq -c '.version // {}' < /tmp/p.json)" '{ version: $version }')
          test "$(echo "$in_ver" | jq -r '.version.ts')" = "123"
          echo "in: $in_ver"

      - uses: docker/setup-buildx-action@v3

      # PRs build only, so a broken Dockerfile is caught without publishing.
      - name: Log in to Aliyun ACR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      # Aliyun ACR rejects OCI image indexes: buildx's default provenance
      # attestation adds an application/vnd.oci.empty.v1+json descriptor that
      # the registry refuses. Disable attestations and emit Docker media types.
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          outputs: type=image,oci-mediatypes=false,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test resource protocol
        if: github.event_name != 'pull_request'
        run: |
          set -e
          img=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          docker pull "$img"

          echo "--- check ---"
          docker run -i --rm "$img" /opt/resource/check <<< '{"source":{}}' | jq -e 'type == "array"'

          echo "--- in ---"
          docker run -i --rm "$img" /opt/resource/in /tmp \
            <<< '{"source":{},"version":{"ts":"123"}}' | jq -e '.version.ts == "123"'
